<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文和訳トレーナー</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 14px #00000010}button{padding:12px 16px;border:0;border-radius:11px;margin:4px;font-size:15px;cursor:pointer}.primary{background:#172033;color:#fff}.gray{background:#e9edf2}.danger{background:#ffe7e7}input,textarea{width:100%;padding:13px;border:1px solid #ccd3dd;border-radius:11px;font-size:16px}textarea{min-height:150px}.hidden{display:none}.result{white-space:pre-wrap;background:#f0f3f7;padding:15px;border-radius:12px;margin-top:12px}.bar{height:8px;background:#dfe4ea;border-radius:99px;overflow:hidden}.fill{height:100%;background:#172033}.stat{display:inline-block;background:#edf0f4;padding:5px 9px;border-radius:99px;font-size:12px;margin:3px}.small{font-size:13px;color:#667085}.model{background:#f7f8fa;border-left:4px solid #172033;padding:12px;border-radius:8px;white-space:pre-wrap}</style></head><body><div class="wrap"><h1>英文和訳トレーナー</h1><div id="login" class="card"><h2>生徒ログイン</h2><input id="loginId" placeholder="生徒ID"><br><br><input id="loginPw" type="password" placeholder="パスワード"><br><button class="primary" onclick="login()">ログイン</button></div><div id="app" class="hidden"><div class="card"><b id="user"></b><button class="gray" onclick="logout()">ログアウト</button></div><div class="card"><button class="primary" onclick="setMode('grade')">和訳採点</button><button class="gray" onclick="setMode('memory')">暗記</button><button class="gray" onclick="next()">次へ</button><button class="gray" onclick="unmastered()">未定着だけ</button><button class="gray" onclick="resetAll()">全問題</button></div><div class="card"><div id="info"></div><div class="bar"><div id="fill" class="fill"></div></div><h2 id="english"></h2><div id="gradeArea"><textarea id="answer" placeholder="日本語訳を入力してください"></textarea><button class="primary" onclick="grade()">AIで採点</button></div><div id="memoryArea" class="hidden"><p>模範解答を見ずに、日本語訳を頭の中で思い出してください。</p><button class="primary" onclick="showAnswer()">答えを見る</button><div id="memoryAnswer"></div></div><div id="result" class="result" style="display:none"></div></div><div class="card"><h3>定着状況</h3><div id="summary"></div><p class="small">連続3回正解したフレーズを「定着」とします。新しい問題は自動生成せず、先生が登録した教材だけを繰り返します。</p></div></div></div><script>
let allQs=[],qs=[],i=0,mode='grade',progress={};const $=id=>document.getElementById(id);async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw new Error(d.error||'エラー');return d}
async function login(){try{const d=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('loginId').value,password:$('loginPw').value})});if(d.user.role!=='student')return alert('生徒アカウントでログインしてください');$('user').textContent=d.user.name+' さん';$('login').classList.add('hidden');$('app').classList.remove('hidden');allQs=await api('/api/questions');qs=[...allQs];progress=await api('/api/progress');render()}catch(e){alert(e.message)}}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}function setMode(m){mode=m;render()}function current(){return qs[i]}function render(){if(!qs.length){$('english').textContent='教材がありません';return}const q=current(),p=progress[q.id]||{streak:0};$('info').innerHTML=`${i+1}/${qs.length} <span class=stat>連続正解 ${p.streak||0}回</span> <span class=stat>${(p.streak||0)>=3?'定着':'練習中'}</span>`;$('fill').style.width=((i+1)/qs.length*100)+'%';$('english').textContent=q.english;$('gradeArea').classList.toggle('hidden',mode!=='grade');$('memoryArea').classList.toggle('hidden',mode!=='memory');$('result').style.display='none';$('answer').value='';$('memoryAnswer').innerHTML='';updateSummary()}
async function grade(){const q=current(),student=$('answer').value.trim();if(!student)return alert('日本語訳を入力してください');try{const d=await api('/api/grade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({questionId:q.id,english:q.english,model:q.model,student})});$('result').style.display='block';$('result').textContent=`【${d.status}】 ${d.score}/10点\n\n${d.explanation}\n\nヒント：${d.hint}`;progress=await api('/api/progress');updateSummary()}catch(e){alert(e.message)}}
async function record(ok){const q=current();await api('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({questionId:q.id,ok})});progress=await api('/api/progress')}
function showAnswer(){const q=current();$('memoryAnswer').innerHTML=`<div class="model">${q.model}</div><button class="gray" onclick="memoryResult(false)">もう一度</button><button class="primary" onclick="memoryResult(true)">できた</button>`}async function memoryResult(ok){await record(ok);next()}function next(){if(!qs.length)return;i=(i+1)%qs.length;render()}function unmastered(){const a=allQs.filter(q=>(progress[q.id]?.streak||0)<3);if(!a.length)return alert('すべて定着しています！');qs=a;i=0;render()}function resetAll(){qs=[...allQs];i=0;render()}function updateSummary(){const base=qs.length||1,n=qs.filter(q=>(progress[q.id]?.streak||0)>=3).length;$('summary').textContent=`${n}/${base} フレーズ定着`}
</script></body></html>
