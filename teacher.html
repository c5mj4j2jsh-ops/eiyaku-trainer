<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教師管理</title><style>body{margin:0;background:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 14px #00000010}input,button{padding:11px;margin:4px;border-radius:10px;border:1px solid #ccd3dd}.primary{background:#172033;color:#fff}.gray{background:#e9edf2}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #e4e7ec;text-align:left;font-size:14px}.tabs button{cursor:pointer}.hidden{display:none}.small{font-size:13px;color:#667085}</style></head><body><div class="wrap"><h1>教師管理</h1><div id="login" class="card"><input id="loginId" placeholder="教師ID"><input id="loginPw" type="password" placeholder="パスワード"><button class="primary" onclick="login()">ログイン</button></div><div id="app" class="hidden"><div class="card"><b>教師ダッシュボード</b><button class="gray" onclick="logout()">ログアウト</button></div><div class="card"><h2>教材管理</h2><input id="file" type="file" accept=".xlsx,.xls,.csv"><button class="primary" onclick="upload()">Excelを読み込む</button><p id="msg"></p><p class="small">「英文」「模範解答」がある行を教材として読み込みます。現在の問題セットを置き換えます。</p></div><div class="card"><h2>生徒追加</h2><input id="sid" placeholder="生徒ID"><input id="sn" placeholder="氏名"><input id="sp" type="password" placeholder="初期パスワード"><button class="primary" onclick="addStudent()">追加</button></div><div class="card tabs"><button class="primary" onclick="show('students')">生徒一覧</button><button class="gray" onclick="show('attempts')">採点履歴</button><button class="gray" onclick="show('mastery')">問題別定着</button></div><div id="students" class="card"><h2>生徒一覧</h2><button onclick="loadStudents()">更新</button><table><thead><tr><th>生徒</th><th>定着</th><th>試行</th><th>正解</th><th>最終学習</th></tr></thead><tbody id="studentRows"></tbody></table></div><div id="attempts" class="card hidden"><h2>採点履歴</h2><button onclick="loadAttempts()">更新</button><table><thead><tr><th>日時</th><th>生徒</th><th>問題</th><th>点</th><th>判定</th><th>回答</th></tr></thead><tbody id="attemptRows"></tbody></table></div><div id="mastery" class="card hidden"><h2>問題別定着</h2><button onclick="loadMastery()">更新</button><table><thead><tr><th>生徒</th><th>問題</th><th>連続正解</th><th>最高/最新点</th><th>状態</th></tr></thead><tbody id="masteryRows"></tbody></table></div></div></div><script>const $=id=>document.getElementById(id);async function api(u,o={}){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw new Error(d.error||'エラー');return d}async function login(){try{const d=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('loginId').value,password:$('loginPw').value})});if(d.user.role!=='teacher')return alert('教師アカウントではありません');$('login').classList.add('hidden');$('app').classList.remove('hidden');loadStudents()}catch(e){alert(e.message)}}async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}async function upload(){try{const f=$('file').files[0];if(!f)return alert('Excelを選択してください');const fd=new FormData();fd.append('file',f);const d=await api('/api/teacher/import',{method:'POST',body:fd});$('msg').textContent=`${d.count}問を登録しました。`;loadStudents()}catch(e){alert(e.message)}}async function addStudent(){try{const d=await api('/api/teacher/students',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('sid').value,name:$('sn').value,password:$('sp').value})});$('sid').value=$('sn').value=$('sp').value='';alert(`${d.name}さんを追加しました`);loadStudents()}catch(e){alert(e.message)}}function show(x){for(const id of ['students','attempts','mastery'])$(id).classList.toggle('hidden',id!==x);if(x==='students')loadStudents();if(x==='attempts')loadAttempts();if(x==='mastery')loadMastery()}async function loadStudents(){const a=await api('/api/teacher/students');$('studentRows').innerHTML=a.map(x=>`<tr><td>${esc(x.name)} (${esc(x.id)})</td><td>${x.mastered}/${x.total}</td><td>${x.attempts}</td><td>${x.correct}</td><td>${x.last_seen||'-'}</td></tr>`).join('')}async function loadAttempts(){const a=await api('/api/teacher/attempts');$('attemptRows').innerHTML=a.map(x=>`<tr><td>${x.created_at}</td><td>${esc(x.name)}</td><td>${esc(x.question_id)}</td><td>${x.score}</td><td>${esc(x.status)}</td><td>${esc(x.student_answer)}</td></tr>`).join('')}async function loadMastery(){const a=await api('/api/teacher/question-mastery');$('masteryRows').innerHTML=a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.question_id)}</td><td>${x.streak||0}</td><td>${x.last_score??'-'}</td><td>${(x.streak||0)>=3?'定着':'練習中'}</td></tr>`).join('')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
